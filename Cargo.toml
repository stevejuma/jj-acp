[workspace]
members = [
  "crates/jj-acp-protocol",
  "crates/jj-acp-agent",
  "crates/jj-acp-runner",
  "crates/jj-acp-control",
  "crates/jj-acp-cli",
  "crates/jj-acp-testkit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
authors = ["LapisMD contributors"]
repository = "https://github.com/stevejuma/jj-acp"
homepage = "https://stevejuma.github.io/jj-acp/"

[workspace.dependencies]
jj-acp-protocol = { path = "crates/jj-acp-protocol", version = "0.1.0" }
jj-acp-agent = { path = "crates/jj-acp-agent", version = "0.1.0" }
jj-acp-runner = { path = "crates/jj-acp-runner", version = "0.1.0" }
jj-acp-control = { path = "crates/jj-acp-control", version = "0.1.0" }
jj-acp-testkit = { path = "crates/jj-acp-testkit", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
