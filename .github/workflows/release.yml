name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      publish_crates:
        description: Publish missing crate versions using trusted publishing
        required: true
        default: true
        type: boolean
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  archives:
    needs: qualify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module -e 'import {validateTag,validateReleaseSource,version} from "./scripts/release-version.mjs"; validateTag(process.env.RELEASE_TAG,version()); validateReleaseSource();'
          git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run:
          cargo build -p jj-acp --release --locked --target ${{ matrix.target }}
      - name: Archive and test executable
        run: node scripts/release-archive.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  crates:
    needs: archives
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
      - run: cargo package --workspace --locked
      - id: existing
        run: node scripts/release-registry.mjs --status
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if:
          steps.existing.outputs.missing != '0' && (github.event_name !=
          'workflow_dispatch' || inputs.publish_crates)
      - name: Publish missing verified packages
        if:
          steps.existing.outputs.missing != '0' && (github.event_name !=
          'workflow_dispatch' || inputs.publish_crates)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/release-registry.mjs --publish
      - run: node scripts/release-registry.mjs
      - run:
          cargo install jj-acp --version "$(node --input-type=module -e 'import
          {version} from
          "./scripts/release-version.mjs";console.log(version())')" --locked
          --root /tmp/jj-acp-install
      - run: /tmp/jj-acp-install/bin/jj-acp --version
  github:
    needs: [archives, crates]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat dist/*.sha256 | sort > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "jj-acp $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          node scripts/release-assets.mjs
          gh release edit "$RELEASE_TAG" --draft=false
