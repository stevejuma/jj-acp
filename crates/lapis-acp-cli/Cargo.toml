[package]
name = "lapis-acp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "lapis_acp_cli"
path = "src/lib.rs"

[[bin]]
name = "lapis-acp"
path = "src/main.rs"

[dependencies]
lapis-acp-protocol.workspace = true
lapis-acp-agent.workspace = true
lapis-acp-runner.workspace = true
lapis-acp-control.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

[dev-dependencies]
lapis-acp-testkit.workspace = true
tokio = { workspace = true, features = ["macros"] }
