[package]
name = "jj-acp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "jj_acp_cli"
path = "src/lib.rs"

[[bin]]
name = "jj-acp"
path = "src/main.rs"

[dependencies]
jj-acp-protocol.workspace = true
jj-acp-agent.workspace = true
jj-acp-runner.workspace = true
jj-acp-control.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

[dev-dependencies]
jj-acp-testkit.workspace = true
tokio = { workspace = true, features = ["macros"] }
