[package]
name = "jj-acp-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Versioned stdio control protocols for controlling ACP applications"
keywords = ["acp", "agent", "stdio", "json-rpc"]
categories = ["development-tools"]

[dependencies]
jj-acp-protocol.workspace = true
jj-acp-agent.workspace = true
jj-acp-runner.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "process",
  "rt",
  "sync",
  "time",
] }

[dev-dependencies]
jj-acp-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
